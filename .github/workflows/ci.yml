name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds run in manylinux_2_28 (glibc 2.28) so the library loads on older distros too
          - platform: linux-x86_64
            runner: ubuntu-24.04
            container: quay.io/pypa/manylinux_2_28_x86_64
            built: target/release/libdeno_webrtc.so
            file: libdeno_webrtc-linux-x86_64.so
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            built: target/release/libdeno_webrtc.so
            file: libdeno_webrtc-linux-aarch64.so
          - platform: darwin-aarch64
            runner: macos-15
            built: target/release/libdeno_webrtc.dylib
            file: libdeno_webrtc-darwin-aarch64.dylib
          - platform: darwin-x86_64
            runner: macos-15-intel
            built: target/release/libdeno_webrtc.dylib
            file: libdeno_webrtc-darwin-x86_64.dylib
          - platform: windows-x86_64
            runner: windows-2025
            built: target/release/deno_webrtc.dll
            file: deno_webrtc-windows-x86_64.dll
    steps:
      - uses: actions/checkout@v4
      - name: rust (container)
        if: matrix.container
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: rust
        if: ${{ !matrix.container }}
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}
      - name: build
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo build --release --locked
          mkdir -p dist
          cp "${{ matrix.built }}" "dist/${{ matrix.file }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: dist/${{ matrix.file }}
          if-no-files-found: error

  test:
    name: test ${{ matrix.platform }}
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, runner: ubuntu-24.04, file: libdeno_webrtc-linux-x86_64.so, chrome: "1" }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm, file: libdeno_webrtc-linux-aarch64.so, chrome: "0" }
          - { platform: darwin-aarch64, runner: macos-15, file: libdeno_webrtc-darwin-aarch64.dylib, chrome: "1" }
          - { platform: darwin-x86_64, runner: macos-15-intel, file: libdeno_webrtc-darwin-x86_64.dylib, chrome: "0" }
          - { platform: windows-x86_64, runner: windows-2025, file: deno_webrtc-windows-x86_64.dll, chrome: "0" }
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: dist
      - name: test (the built library, as released)
        shell: bash
        env:
          DENO_WEBRTC_LIB: ${{ github.workspace }}/dist/${{ matrix.file }}
          DENO_WEBRTC_SKIP_CHROME: ${{ matrix.chrome == '1' && '0' || '1' }}
        run: deno task test
