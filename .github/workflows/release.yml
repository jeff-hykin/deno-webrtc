name: release

# Builds and tests every platform, then commits the binaries' checksums and the version,
# tags that commit vX.Y.Z, and attaches the binaries to the GitHub release of that tag.
# The module at the tag therefore knows the exact sha256 of each binary it downloads.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "version to release, e.g. 0.1.0"
        required: true

permissions:
  contents: write

concurrency: release

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-24.04
    outputs:
      tag: v${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: checksums and version
        run: deno run --allow-read --allow-write scripts/stamp_release.js "${{ inputs.version }}" dist
      - name: commit, tag, release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/binary_checksums.js js/version.js deno.json Cargo.toml Cargo.lock
          git commit -m "release v$version"
          git tag "v$version"
          git push origin "HEAD:${GITHUB_REF_NAME}" "v$version"
          (cd dist && sha256sum * > SHA256SUMS)
          gh release create "v$version" dist/* --title "v$version" --notes "Prebuilt native libraries for deno-webrtc v$version. \`import { RTCPeerConnection } from \"https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/v$version/mod.js\"\` downloads the right one and checks its sha256."

  verify:
    name: verify ${{ matrix.runner }}
    needs: publish
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025]
    steps:
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: import the released module by URL; it downloads its binary and connects
        shell: bash
        run: |
          deno run --allow-ffi --allow-env --allow-read --allow-write --allow-net \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${{ needs.publish.outputs.tag }}/examples/loopback.js"
