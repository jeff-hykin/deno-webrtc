[package]
name = "deno_webrtc"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "The native half of deno-webrtc: webrtc-rs behind a C ABI for Deno.dlopen"
repository = "https://github.com/jeff-hykin/deno-webrtc"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
webrtc = { package = "zenoh-web-webrtc", path = "vendor/webrtc" }
rtc = { package = "zenoh-web-rtc", path = "vendor/rtc" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "macros"] }
futures = "0.3"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
rand = "0.9"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
